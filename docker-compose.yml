# Frontend-only compose file. The backend and PostgreSQL live in a separate
# repository — this repo does not orchestrate them. `VITE_API_URL` is baked
# into the image at build time (Vite inlines env vars), so point it at
# wherever your backend actually runs before building.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - '${FRONTEND_PORT:-8080}:4173'
